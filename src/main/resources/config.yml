# OverEnchant
#
# Lets an anvil combine two items/books that already share an enchantment at the
# same level into a level ONE HIGHER than either of them - exactly like vanilla
# already does (V + V = VI) - except the result is no longer capped at the
# enchantment's normal maximum. Each enchantment below defines its own "cap":
# the highest level obtainable this way. Levels above vanilla's own max still
# only come from combining two items that already carry that enchantment.
#
# "max-effect: instamine" (currently only used on efficiency) makes a tool break
# any block instantly, regardless of hardness, once it reaches its cap.

# Language setting: "en" for English, "de" for German
# Can also be changed in-game with /overenchant lang <de|en>
language: "en"

anvil:
  # Extra XP levels charged per level gained ABOVE the enchantment's normal vanilla
  # max level. Levels within the vanilla range still use normal vanilla anvil cost.
  # If merges above the vanilla cap show "Too Expensive!" for survival players,
  # raise `settings.anvil-max-repair-cost` in spigot.yml (or set it to -1).
  xp-cost-per-overlevel: 3

enchantments:
  # Tools & Weapons
  efficiency:
    cap: 15
    max-effect: instamine
  sharpness:
    cap: 10
  smite:
    cap: 10
  bane_of_arthropods:
    cap: 10
  knockback:
    cap: 10
  fire_aspect:
    cap: 10
  looting:
    cap: 10
  sweeping_edge:
    cap: 8
  unbreaking:
    cap: 10
  fortune:
    cap: 10

  # Mace (Minecraft 1.21+)
  density:
    cap: 10
  breach:
    cap: 10
  wind_burst:
    cap: 6

  # Bow & Crossbow
  power:
    cap: 10
  punch:
    cap: 10
  flame:
    cap: 1
  infinity:
    cap: 1
  piercing:
    cap: 10
  quick_charge:
    cap: 5
  multishot:
    cap: 1

  # Trident & Spear
  loyalty:
    cap: 8
  impaling:
    cap: 10
  riptide:
    cap: 6
  channeling:
    cap: 1
  lunge:
    cap: 6

  # Armor
  protection:
    cap: 10
  projectile_protection:
    cap: 10
  blast_protection:
    cap: 10
  fire_protection:
    cap: 10
  feather_falling:
    cap: 10
  respiration:
    cap: 10
  aqua_affinity:
    cap: 1
  thorns:
    cap: 10
  depth_strider:
    cap: 8
  frost_walker:
    cap: 6
  soul_speed:
    cap: 6
  swift_sneak:
    cap: 6

  # Fishing
  lure:
    cap: 8
  luck_of_the_sea:
    cap: 8

  # Utility & Curses
  silk_touch:
    cap: 1
  mending:
    cap: 1
  binding_curse:
    cap: 1
  vanishing_curse:
    cap: 1
