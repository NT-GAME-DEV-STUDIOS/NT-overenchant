name: NT-overenchant
version: '${version}'
main: dev.ntgame.overenchant.OverEnchantPlugin
authors: [NT-GAME-DEV-STUDIOS]
website: https://github.com/NT-GAME-DEV-STUDIOS/NT-overenchant
description: Lets enchantments on an anvil be stacked past their vanilla max level, up to a configurable cap per enchantment.

commands:
  overenchant:
    description: Manage the OverEnchant plugin
    usage: /overenchant reload
    permission: overenchant.admin
    aliases: [oe]

permissions:
  overenchant.admin:
    description: Allows reloading the OverEnchant config
    default: op
  overenchant.use:
    description: Allows benefiting from overenchanted anvil merges
    default: true
